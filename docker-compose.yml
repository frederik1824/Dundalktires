services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dundalk-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=dundalk_tires
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - APP_URL=http://localhost:8000
    networks:
      - dundalk-network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: dundalk-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dundalk-network
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: dundalk-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dundalk_tires
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - dundalk-mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dundalk-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dundalk-mysql-data:
    driver: local

networks:
  dundalk-network:
    driver: bridge
